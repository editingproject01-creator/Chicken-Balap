<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Chicken Balap</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐔</text></svg>"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");

      body {
        font-family: "Press Start 2P", cursive, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation; /* Mencegah zoom saat double tap */
      }

      /* Sembunyikan kontrol sentuh hanya di perangkat yang menggunakan mouse (PC/Laptop) */
      @media (hover: hover) and (pointer: fine) {
        .touch-controls {
          display: none !important;
        }
      }

      /* Animasi pop-in untuk overlay */
      @keyframes popIn {
        0% {
          transform: scale(0.9);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .pop-in {
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
    </style>
  </head>
  <!-- h-[100dvh] memastikan layout pas dengan layar HP termasuk address bar -->
  <body
    class="bg-slate-900 text-white h-[100dvh] w-full flex flex-col items-center justify-center p-2 sm:p-4 overflow-hidden select-none"
  >
    <!-- Main Container: Flexbox untuk mengisi tinggi layar -->
    <div
      class="w-full max-w-4xl h-full flex flex-col items-center justify-between gap-3"
    >
      <!-- Header / Title -->
      <div
        class="w-full flex justify-between items-center px-2 shrink-0 pt-2 text-[10px] sm:text-sm"
      >
        <div class="flex items-center gap-2 text-amber-400">
          <span class="text-2xl">🐔</span>
          <span class="tracking-widest font-bold">CHICKEN BALAP</span>
        </div>
        <div class="text-slate-400 flex flex-col items-end">
          <span>REKOR</span>
          <span id="highScoreText" class="text-amber-300 text-sm sm:text-base"
            >00000</span
          >
        </div>
      </div>

      <!-- Canvas Container: Menggunakan sisa ruang (flex-1) dan mencegah meluap -->
      <div
        class="relative w-full flex-1 min-h-0 bg-sky-200 rounded-2xl overflow-hidden border-[6px] border-slate-700 shadow-2xl flex justify-center items-center"
      >
        <!-- Canvas Element: object-contain memastikan kanvas tidak gepeng dan pas di dalam container -->
        <canvas
          id="gameCanvas"
          class="w-full h-full object-contain block"
        ></canvas>

        <!-- Overlay UI (Start / Game Over) -->
        <div
          id="overlay"
          class="absolute inset-0 bg-slate-900/85 backdrop-blur-md flex flex-col items-center justify-center p-6 transition-all duration-300 z-10"
        >
          <div
            id="overlayContent"
            class="text-center flex flex-col items-center gap-5 pop-in"
          >
            <div
              id="gameTitle"
              class="text-3xl sm:text-5xl font-bold text-amber-400 drop-shadow-[0_5px_0_rgba(0,0,0,0.9)] tracking-widest leading-tight"
            >
              CHICKEN<br />BALAP!
            </div>
            <p
              id="gameSubText"
              class="text-xs sm:text-sm text-slate-200 max-w-[250px] leading-relaxed"
            >
              Bantu Si Ayam agar tidak masuk wajan penggorengan!
            </p>

            <button
              id="startBtn"
              class="mt-4 px-8 py-4 bg-amber-500 hover:bg-amber-400 active:translate-y-1 text-slate-950 font-bold text-base sm:text-lg rounded-xl border-b-[5px] border-amber-700 transition-all cursor-pointer shadow-xl flex items-center gap-2"
            >
              <span>GASKEN 🔥</span>
            </button>

            <div
              class="text-[9px] sm:text-xs text-slate-400 mt-4 flex flex-col gap-2"
            >
              <span
                class="bg-slate-800 px-3 py-2 rounded-md border border-slate-700"
                >Kiri Layar = NUNDUK</span
              >
              <span
                class="bg-slate-800 px-3 py-2 rounded-md border border-slate-700"
                >Kanan Layar = LOMPAT</span
              >
            </div>
          </div>
        </div>

        <!-- Live Score Badge in Canvas -->
        <div
          class="absolute top-4 right-4 bg-slate-900/70 backdrop-blur-md px-4 py-2 rounded-xl border-2 border-slate-700 text-sm sm:text-base font-mono text-emerald-400 font-bold tracking-widest shadow-lg z-0"
        >
          <span id="scoreText">00000</span>
        </div>
      </div>

      <!-- Touch Control Helper (Mobile Ergonomics) -->
      <div class="w-full flex gap-3 shrink-0 pb-2 px-1 touch-controls">
        <button
          id="mobileDuckBtn"
          class="flex-1 py-5 bg-slate-800 border-b-4 border-slate-700 rounded-2xl text-sm font-bold text-slate-300 active:bg-slate-700 active:translate-y-1 transition-transform flex flex-col items-center justify-center gap-1 shadow-lg"
        >
          <span class="text-2xl">🔽</span>
          <span>NUNDUK</span>
        </button>
        <button
          id="mobileJumpBtn"
          class="flex-1 py-5 bg-amber-600 border-b-4 border-amber-700 rounded-2xl text-sm font-bold text-white active:bg-amber-500 active:translate-y-1 transition-transform flex flex-col items-center justify-center gap-1 shadow-lg"
        >
          <span class="text-2xl">🔼</span>
          <span>LOMPAT</span>
        </button>
      </div>
      <!-- Footer -->
      <div
        class="w-full text-center text-[9px] sm:text-xs text-slate-500 shrink-0 pb-1"
      >
        &copy; 2026 Luqman ID. Semua hak dilindungi undang-undang
      </div>
    </div>

    <script>
      // Audio Synthesizer (Tidak butuh file eksternal)
      class SoundFX {
        constructor() {
          this.ctx = null;
        }

        init() {
          if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          }
        }

        playJump() {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(150, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(
            400,
            this.ctx.currentTime + 0.15,
          );
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.15);
        }

        playScore() {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = "square";
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          osc.frequency.setValueAtTime(800, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.16);
        }

        playHit() {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(120, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(
            30,
            this.ctx.currentTime + 0.3,
          );
          gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        }
      }

      const sound = new SoundFX();

      // Canvas Setup - Internal Resolution diperbesar
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      // UI Elements
      const overlay = document.getElementById("overlay");
      const gameTitle = document.getElementById("gameTitle");
      const gameSubText = document.getElementById("gameSubText");
      const startBtn = document.getElementById("startBtn");
      const scoreText = document.getElementById("scoreText");
      const highScoreText = document.getElementById("highScoreText");
      const mobileJumpBtn = document.getElementById("mobileJumpBtn");
      const mobileDuckBtn = document.getElementById("mobileDuckBtn");

      // Resolusi Kanvas yang lebih proporsional & tinggi (4:3 ratio) untuk kenyamanan Mobile
      const CANVAS_WIDTH = 800;
      const CANVAS_HEIGHT = 600;
      canvas.width = CANVAS_WIDTH;
      canvas.height = CANVAS_HEIGHT;

      // Game Variables
      let gameRunning = false;
      let score = 0;
      let highScore = parseInt(
        localStorage.getItem("chicken_runner_hi") || "0",
      );
      let gameSpeed = 8; // Sedikit lebih cepat karena area pandang lebih besar
      let frameCount = 0;
      let animationFrameId = null;

      highScoreText.textContent = String(highScore).padStart(5, "0");

      // Ground position diturunkan karena tinggi kanvas bertambah
      const GROUND_Y = 480;

      // Faktor Skala Global (Membesarkan ukuran semua entitas)
      const SCALE = 1.5;

      // Chicken Player Object - Ukuran Fisika sudah dikalikan 1.5x lipat
      const chicken = {
        x: 80,
        // Ukuran asli 42 x 45 -> Menjadi 63 x 67.5
        width: 42 * SCALE,
        height: 45 * SCALE,
        normalHeight: 45 * SCALE,
        duckHeight: 25 * SCALE,
        vy: 0,

        // Gravitasi & Jump Force disesuaikan agar feel lompatan tetap sama
        gravity: 0.7 * SCALE,
        jumpForce: -13.5 * SCALE,

        isGrounded: true,
        isDucking: false,
        wingAnimFrame: 0,

        reset() {
          this.height = this.normalHeight;
          this.y = GROUND_Y - this.normalHeight;
          this.vy = 0;
          this.isGrounded = true;
          this.isDucking = false;
        },

        jump() {
          if (this.isGrounded && !this.isDucking) {
            this.vy = this.jumpForce;
            this.isGrounded = false;
            sound.playJump();
          }
        },

        duck(ducking) {
          if (this.isGrounded) {
            this.isDucking = ducking;
            if (ducking) {
              this.height = this.duckHeight;
              this.y = GROUND_Y - this.duckHeight;
            } else {
              this.height = this.normalHeight;
              this.y = GROUND_Y - this.normalHeight;
            }
          }
        },

        update() {
          this.vy += this.gravity;
          this.y += this.vy;

          const currentGroundY = GROUND_Y - this.height;
          if (this.y >= currentGroundY) {
            this.y = currentGroundY;
            this.vy = 0;
            this.isGrounded = true;
          }

          if (frameCount % 6 === 0) {
            this.wingAnimFrame = (this.wingAnimFrame + 1) % 4;
          }
        },

        draw(ctx) {
          ctx.save();
          // Translate ke posisi aktual ayam, kemudian perbesar skala gambarnya
          ctx.translate(this.x, this.y);
          ctx.scale(SCALE, SCALE);

          if (this.isDucking) {
            // -- Ducking Sprite --
            ctx.fillStyle = "#facc15";
            ctx.beginPath();
            ctx.ellipse(22, 14, 22, 11, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ef4444";
            ctx.fillRect(36, 2, 6, 6);

            ctx.fillStyle = "#f97316";
            ctx.beginPath();
            ctx.moveTo(40, 10);
            ctx.lineTo(48, 14);
            ctx.lineTo(40, 17);
            ctx.fill();

            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(35, 9, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#eab308";
            ctx.beginPath();
            ctx.ellipse(16, 14, 10, 5, -0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#f97316";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(10, 22);
            ctx.lineTo(6, 25);
            ctx.moveTo(25, 22);
            ctx.lineTo(21, 25);
            ctx.stroke();
          } else {
            // -- Standing / Jumping Sprite --
            ctx.strokeStyle = "#f97316";
            ctx.lineWidth = 3.5;
            const legOffset = this.isGrounded
              ? Math.sin(frameCount * 0.3) * 8
              : 0;

            ctx.beginPath();
            ctx.moveTo(16, 38);
            ctx.lineTo(16 - legOffset, 45);
            ctx.lineTo(22 - legOffset, 45);
            ctx.moveTo(28, 38);
            ctx.lineTo(28 + legOffset, 45);
            ctx.lineTo(34 + legOffset, 45);
            ctx.stroke();

            ctx.fillStyle = "#eab308";
            ctx.beginPath();
            ctx.moveTo(2, 20);
            ctx.lineTo(-8, 12);
            ctx.lineTo(4, 26);
            ctx.moveTo(2, 22);
            ctx.lineTo(-10, 20);
            ctx.lineTo(4, 28);
            ctx.fill();

            ctx.fillStyle = "#facc15";
            ctx.beginPath();
            ctx.ellipse(20, 24, 16, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(28, 13, 11, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(25, 2, 4, 0, Math.PI * 2);
            ctx.arc(29, 0, 4.5, 0, Math.PI * 2);
            ctx.arc(33, 2, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(36, 20, 3.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#f97316";
            ctx.beginPath();
            ctx.moveTo(36, 12);
            ctx.lineTo(45, 16);
            ctx.lineTo(36, 19);
            ctx.fill();

            ctx.fillStyle = "#000000";
            ctx.beginPath();
            ctx.arc(31, 10, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(32, 9, 1, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#eab308";
            ctx.save();
            ctx.translate(16, 22);
            const wingAngle = this.isGrounded
              ? Math.sin(frameCount * 0.4) * 0.2
              : Math.sin(frameCount * 0.8) * 0.6 - 0.3;
            ctx.rotate(wingAngle);
            ctx.beginPath();
            ctx.ellipse(0, 0, 10, 6, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          ctx.restore();
        },
      };

      let obstacles = [];

      class Obstacle {
        constructor(type) {
          this.type = type;
          this.x = CANVAS_WIDTH + 100;

          // Ukuran rintangan juga diperbesar 1.5x lipat
          if (type === "cactus") {
            this.width = 28 * SCALE;
            this.height = 50 * SCALE;
            this.y = GROUND_Y - this.height;
          } else if (type === "egg") {
            this.width = 30 * SCALE;
            this.height = 36 * SCALE;
            this.y = GROUND_Y - this.height;
          } else if (type === "bird") {
            this.width = 44 * SCALE;
            this.height = 32 * SCALE;
            // Spawn height disesuaikan dengan tinggi ayam yang baru
            this.y =
              Math.random() > 0.5
                ? GROUND_Y - 75 * SCALE
                : GROUND_Y - 42 * SCALE;
          }
        }

        update() {
          this.x -= gameSpeed;
        }

        draw(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.scale(SCALE, SCALE); // Vektor digambar 1.5x lebih besar

          if (this.type === "cactus") {
            ctx.fillStyle = "#15803d";
            ctx.fillRect(10, 0, 10, 50);
            ctx.fillRect(2, 15, 10, 6);
            ctx.fillRect(2, 10, 5, 10);
            ctx.fillRect(18, 22, 8, 6);
            ctx.fillRect(21, 14, 5, 12);
            ctx.fillStyle = "#166534";
            ctx.fillRect(12, 0, 3, 50);
          } else if (this.type === "egg") {
            ctx.fillStyle = "#d97706";
            ctx.beginPath();
            ctx.ellipse(15, 28, 18, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#f8fafc";
            ctx.beginPath();
            ctx.ellipse(15, 18, 11, 15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#cbd5e1";
            ctx.beginPath();
            ctx.arc(11, 14, 2.5, 0, Math.PI * 2);
            ctx.arc(18, 22, 3, 0, Math.PI * 2);
            ctx.arc(13, 25, 2, 0, Math.PI * 2);
            ctx.fill();
          } else if (this.type === "bird") {
            const flap = Math.sin(frameCount * 0.3) > 0;
            ctx.fillStyle = "#475569";
            ctx.beginPath();
            ctx.ellipse(20, 16, 16, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(32, 10, 8, 7);
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.moveTo(40, 10);
            ctx.lineTo(48, 14);
            ctx.lineTo(40, 17);
            ctx.fill();
            ctx.fillStyle = "#334155";
            ctx.beginPath();
            if (flap) {
              ctx.moveTo(15, 16);
              ctx.lineTo(25, -6);
              ctx.lineTo(28, 16);
            } else {
              ctx.moveTo(15, 16);
              ctx.lineTo(25, 32);
              ctx.lineTo(28, 16);
            }
            ctx.fill();
          }

          ctx.restore();
        }
      }

      // Clouds
      let clouds = [];
      function manageClouds() {
        if (frameCount % 90 === 0 && Math.random() > 0.3) {
          clouds.push({
            x: CANVAS_WIDTH + 60,
            y: Math.random() * 200 + 40,
            speed: Math.random() * 0.8 + 0.5,
            scale: Math.random() * 0.7 + 0.8, // Awan dibuat lebih besar
          });
        }
        clouds.forEach((cloud, index) => {
          cloud.x -= cloud.speed;
          ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
          ctx.beginPath();
          // Skala awan ikut diperbesar agar imbang dengan karakter
          const cScale = cloud.scale * SCALE;
          ctx.arc(cloud.x, cloud.y, 18 * cScale, 0, Math.PI * 2);
          ctx.arc(
            cloud.x + 15 * cScale,
            cloud.y - 10 * cScale,
            22 * cScale,
            0,
            Math.PI * 2,
          );
          ctx.arc(cloud.x + 35 * cScale, cloud.y, 18 * cScale, 0, Math.PI * 2);
          ctx.fill();
          if (cloud.x < -150) clouds.splice(index, 1);
        });
      }

      let obstacleTimer = 0;
      let minObstacleInterval = 80;

      function manageObstacles() {
        obstacleTimer++;
        if (obstacleTimer > minObstacleInterval) {
          if (Math.random() < 0.6) {
            const types = ["cactus", "egg", "bird"];
            const availableTypes = score > 150 ? types : ["cactus", "egg"];
            const selectedType =
              availableTypes[Math.floor(Math.random() * availableTypes.length)];
            obstacles.push(new Obstacle(selectedType));
            obstacleTimer = 0;
            minObstacleInterval =
              Math.floor(Math.random() * 40) +
              Math.max(45, 90 - Math.floor(score / 100));
          }
        }
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.update();
          obs.draw(ctx);

          if (checkCollision(chicken, obs)) {
            handleGameOver();
          }
          if (obs.x + obs.width < -50) {
            obstacles.splice(i, 1);
          }
        }
      }

      // Hitbox disesuaikan secara proporsional dengan skala baru
      function checkCollision(rect1, rect2) {
        const padding = 9; // Padding asli (6) * SCALE (1.5)
        return (
          rect1.x + padding < rect2.x + rect2.width &&
          rect1.x + rect1.width - padding > rect2.x &&
          rect1.y + padding < rect2.y + rect2.height &&
          rect1.y + rect1.height - padding > rect2.y
        );
      }

      function lerpColor(color1, color2, factor) {
        let c1 = parseInt(color1.substring(1), 16);
        let c2 = parseInt(color2.substring(1), 16);
        let r1 = (c1 >> 16) & 255,
          g1 = (c1 >> 8) & 255,
          b1 = c1 & 255;
        let r2 = (c2 >> 16) & 255,
          g2 = (c2 >> 8) & 255,
          b2 = c2 & 255;
        let r = Math.round(r1 + factor * (r2 - r1));
        let g = Math.round(g1 + factor * (g2 - g1));
        let b = Math.round(b1 + factor * (b2 - b1));
        return (
          "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1)
        );
      }

      let groundOffset = 0;
      function drawEnvironment() {
        const framesPerPhase = 1200;
        const totalPhases = 4;
        const totalCycleFrames = framesPerPhase * totalPhases;
        const currentCycleFrame = frameCount % totalCycleFrames;
        const currentPhase = Math.floor(currentCycleFrame / framesPerPhase);
        const progress = (currentCycleFrame % framesPerPhase) / framesPerPhase;

        const phases = [
          {
            top: "#bae6fd",
            bottom: "#f0f9ff",
            celestial1: "#fde047",
            celestial2: "#fef08a",
            dirt: "#854d0e",
            grass: "#22c55e",
            detail: "#16a34a",
          },
          {
            top: "#38bdf8",
            bottom: "#bae6fd",
            celestial1: "#fef08a",
            celestial2: "#fef9c3",
            dirt: "#854d0e",
            grass: "#22c55e",
            detail: "#16a34a",
          },
          {
            top: "#f97316",
            bottom: "#fde047",
            celestial1: "#ea580c",
            celestial2: "#fdba74",
            dirt: "#713f12",
            grass: "#16a34a",
            detail: "#15803d",
          },
          {
            top: "#0f172a",
            bottom: "#1e293b",
            celestial1: "#e2e8f0",
            celestial2: "#f8fafc",
            dirt: "#422006",
            grass: "#14532d",
            detail: "#166534",
          },
        ];

        const current = phases[currentPhase];
        const next = phases[(currentPhase + 1) % totalPhases];

        const currentTopColor = lerpColor(current.top, next.top, progress);
        const currentBottomColor = lerpColor(
          current.bottom,
          next.bottom,
          progress,
        );
        const currentCelestial1 = lerpColor(
          current.celestial1,
          next.celestial1,
          progress,
        );
        const currentCelestial2 = lerpColor(
          current.celestial2,
          next.celestial2,
          progress,
        );
        const currentDirt = lerpColor(current.dirt, next.dirt, progress);
        const currentGrass = lerpColor(current.grass, next.grass, progress);
        const currentDetail = lerpColor(current.detail, next.detail, progress);

        // Sky
        const skyGradient = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        skyGradient.addColorStop(0, currentTopColor);
        skyGradient.addColorStop(1, currentBottomColor);
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, CANVAS_WIDTH, GROUND_Y);

        // Celestial Body (Sun/Moon)
        let celestialY = 120;
        if (currentPhase === 0) celestialY = 120 + (1 - progress) * 120;
        else if (currentPhase === 1) celestialY = 120;
        else if (currentPhase === 2) celestialY = 120 + progress * 120;
        else if (currentPhase === 3) {
          if (progress < 0.5) celestialY = 120 + (1 - progress * 2) * 120;
          else celestialY = 120 + (progress - 0.5) * 2 * 120;
        }

        ctx.fillStyle = currentCelestial1;
        ctx.beginPath();
        ctx.arc(700, celestialY, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = currentCelestial2;
        ctx.beginPath();
        ctx.arc(700, celestialY, 50, 0, Math.PI * 2);
        ctx.fill();

        // Ground & Grass
        ctx.fillStyle = currentDirt;
        ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);
        ctx.fillStyle = currentGrass;
        ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, 15);

        // Ground Detail Animation
        groundOffset = (groundOffset + gameSpeed) % 60;
        ctx.fillStyle = currentDetail;
        for (let x = -groundOffset; x < CANVAS_WIDTH; x += 60) {
          ctx.fillRect(x, GROUND_Y - 6, 18, 6);
          ctx.fillRect(x + 30, GROUND_Y + 18, 9, 4.5);
        }
      }

      function gameLoop() {
        if (!gameRunning) return;
        frameCount++;
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        drawEnvironment();
        manageClouds();

        chicken.update();
        chicken.draw(ctx);

        manageObstacles();

        score += 0.15;
        const currentScoreInt = Math.floor(score);
        scoreText.textContent = String(currentScoreInt).padStart(5, "0");

        if (
          currentScoreInt > 0 &&
          currentScoreInt % 100 === 0 &&
          Math.floor(score - 0.15) % 100 !== 0
        ) {
          sound.playScore();
        }

        if (frameCount % 300 === 0 && gameSpeed < 16) {
          gameSpeed += 0.5;
        }

        animationFrameId = requestAnimationFrame(gameLoop);
      }

      function startGame() {
        sound.init();
        gameRunning = true;
        score = 0;
        gameSpeed = 8;
        frameCount = 0;
        obstacleTimer = 0;
        obstacles = [];
        clouds = [];
        chicken.reset();

        overlay.classList.add("hidden");
        overlayContent.classList.remove("pop-in"); // Reset animasi overlay
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        gameLoop();
      }

      function handleGameOver() {
        gameRunning = false;
        sound.playHit();
        const finalScore = Math.floor(score);
        if (finalScore > highScore) {
          highScore = finalScore;
          localStorage.setItem("chicken_runner_hi", highScore);
          highScoreText.textContent = String(highScore).padStart(5, "0");
        }

        gameTitle.innerHTML = "WADUH<br/>MATI!";
        gameTitle.className =
          "text-4xl sm:text-5xl font-bold text-red-500 drop-shadow-[0_5px_0_rgba(0,0,0,0.9)] tracking-widest leading-tight";
        gameSubText.innerHTML = `Skor Terakhir: <br/><span class="text-amber-300 font-bold text-xl">${finalScore}</span>`;
        startBtn.innerHTML = `<span>MAIN LAGI 🔄</span>`;

        overlay.classList.remove("hidden");
        // Trigger reflow & re-add animation
        void overlayContent.offsetWidth;
        overlayContent.classList.add("pop-in");
      }

      // Input Handlers
      function handleKeyDown(e) {
        if (e.code === "Space" || e.code === "ArrowUp") {
          e.preventDefault();
          if (!gameRunning) startGame();
          else chicken.jump();
        } else if (e.code === "ArrowDown") {
          e.preventDefault();
          if (gameRunning) chicken.duck(true);
        }
      }

      function handleKeyUp(e) {
        if (e.code === "ArrowDown") {
          if (gameRunning) chicken.duck(false);
        }
      }

      // Responsive Screen Tap (Left side to Duck, Right side to Jump)
      canvas.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          if (!gameRunning) {
            startGame();
            return;
          }

          const touch = e.touches[0];
          const screenWidth = window.innerWidth;
          if (touch.clientX < screenWidth / 2) {
            chicken.duck(true);
          } else {
            chicken.jump();
          }
        },
        { passive: false },
      );

      canvas.addEventListener("touchend", (e) => {
        e.preventDefault();
        if (gameRunning) chicken.duck(false);
      });

      // Dedicated Mobile Buttons
      mobileJumpBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (!gameRunning) startGame();
        else chicken.jump();
      });

      mobileDuckBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (gameRunning) chicken.duck(true);
      });

      mobileDuckBtn.addEventListener("touchend", (e) => {
        e.preventDefault();
        if (gameRunning) chicken.duck(false);
      });

      window.addEventListener("keydown", handleKeyDown);
      window.addEventListener("keyup", handleKeyUp);
      startBtn.addEventListener("click", startGame);

      drawEnvironment();
      chicken.draw(ctx);
    </script>
  </body>
</html>
